<style>

  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic","Noto Sans Arabic",Tahoma,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6}
  header{background:var(--accent);color:#fff;padding:28px 20px}
  header .wrap{max-width:900px;margin:0 auto}
  .topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .dept{font-size:.95rem;opacity:.95}
  .dept b{display:block;font-size:1.05rem}
  .langs{display:flex;gap:6px}
  .langs button{border:1px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:999px;
    padding:4px 14px;cursor:pointer;font:inherit;font-size:.9rem}
  .langs button.active{background:#fff;color:var(--accent);font-weight:700}
  header h1{margin:0 0 6px;font-size:1.7rem}
  header p{margin:0;opacity:.92}
  nav{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
  nav .wrap{max-width:900px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px 12px}
  nav button{border:0;background:none;color:var(--muted);padding:10px 14px;cursor:pointer;
    font:inherit;border-radius:8px;white-space:nowrap}
  nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
  section{display:none} section.active{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  h2{margin:8px 0 12px} h3{margin:0 0 6px}
  table{width:100%;border-collapse:collapse;font-size:.95rem}
  th,td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;width:28%}
  .week{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
  .week summary{cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center;list-style:none}
  .week summary::-webkit-details-marker{display:none}
  .num{background:var(--accent);color:#fff;border-radius:50%;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
  .week.done .num{background:var(--muted)}
  .week .body{padding:0 16px 16px;padding-inline-start:62px}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;
    padding:2px 10px;font-size:.8rem;margin:2px 4px 2px 0;margin-inline:0 4px}
  label.check{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--muted);cursor:pointer}
  .bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
  .bar>div{height:100%;background:var(--accent);width:0;transition:width .3s}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .tool{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card)}
  .tool b{display:block}
  .tool small{color:var(--muted)}
  input[type=search],input[type=number]{font:inherit;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--ink)}
  input[type=search]{width:100%;margin-bottom:12px}
  input[type=number]{width:90px}
  .calc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;
    border-bottom:1px solid var(--line)}
  .result{font-size:1.6rem;font-weight:700;color:var(--accent)}
  .note{color:var(--muted);font-size:.9rem}
  .quiz button.opt{display:block;width:100%;text-align:start;margin:6px 0;padding:10px 12px;font:inherit;
    border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
  .quiz button.opt.ok{border-color:var(--accent);background:var(--accent-soft)}
  .quiz button.opt.ko{border-color:var(--warn)}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer;margin-top:8px}
  footer{text-align:center;color:var(--muted);font-size:.9rem;padding:24px 16px;border-top:1px solid var(--line)}
  footer b{color:var(--ink)}
  [dir=rtl] ul,[dir=rtl] ol{padding-inline-start:24px}
</style>
</head>

<header>

    <p id="subtitle"></p>
  </div>
</header>

<nav><div class="wrap" id="tabs"></div></nav>

<main>
  <section id="presentation">
    <h2 id="h-pres"></h2>
    <div class="card"><p id="pres-intro"></p><table id="pres-table"></table></div>
    <div class="card"><h3 id="h-obj"></h3><ol id="objectifs"></ol></div>

    <div id="weeks"></div>
    <div class="card"><h3 id="h-trame"></h3><p id="trame"></p></div>

  <section id="outils">
    <h2 id="h-tools"></h2>
    <input type="search" id="search">
    <div class="grid" id="tools"></div>
    <p class="note" id="tools-note"></p>
  </section>

  <section id="evaluation">
    <h2 id="h-eval"></h2>

      <p class="note" id="calc-hint"></p>
      <div id="calc"></div>
      <div class="calc-row"><b id="final-label"></b><span class="result" id="final">0.00 / 20</span></div>
    </div>
    <div class="card"><h3 id="h-proj"></h3><p id="proj"></p><h3 id="h-rules"></h3><p id="rules"></p></div>
  </section>

  <section id="quiz">
    <h2 id="h-quiz"></h2>
    <div class="card quiz" id="quizbox"></div>
  </section>

  <section id="organisation">
    <h2 id="h-org"></h2>
    <div class="card"><ul id="org-list"></ul></div>
    <div class="card"><h3 id="h-res"></h3><ul id="res-list"></ul><p class="note" id="res-note"></p></div>
  </section>
</main>

<footer>
  <div id="sign"></div>
  <div class="note" id="license"></div>
</footer>

   ["Python + Jupyter","البرمجة والحساب","MATLAB (استعمال أساسي)"],["NumPy, Pandas, Matplotlib","البيانات والرسوم البيانية","Excel, Origin"],
   ["QGIS","نظام المعلومات الجغرافية والخرائط","ArcGIS"],["ObsPy, SeisComP","علم الزلازل","برامج تجارية لمعالجة البيانات الزلزالية"],
   ["GMT / PyGMT","الخرائط والأشكال العلمية","Surfer"],["SimPEG, Harmonica","الجاذبية والمغناطيسية (Python)","Oasis montaj"],
   ["Git, GitHub, GitLab","إدارة الإصدارات ومشاركة الشيفرة","المجلدات المشتركة"],["LaTeX / Overleaf","الكتابة العلمية","Word للمعادلات"]
  ],
  hEval:"التقييم وسلّم التنقيط", calcHint:"أدخل نقاطك (من 20 لكل عنصر) لتقدير علامتك النهائية.",
  gradeItems:["الاختبارات والتمارين الأسبوعية","المشاركة","المشروع المصغّر النهائي","العرض الشفهي"],
  points:"نقاط", finalLabel:"العلامة النهائية المقدّرة",
  hProj:"المشروع المصغّر: مثال على موضوع",
  proj:"تحميل كتالوج زلازل منطقة ما من موقع USGS، ورسم التوزيع حسب القدر والعمق، وإنجاز خريطة بـ QGIS، ثم رفع كل ذلك إلى GitHub مع ملف README ورخصة من اختيارك.",
  hRules:"القواعد",

  hQuiz:"اختبار الأسبوع الأول", qOf:(i,n)=>`السؤال ${i} من ${n}`, next:"التالي", finished:"انتهى",
  yourScore:"نتيجتك:", again:"إعادة المحاولة",
  quiz:[
   {q:"أي من هذه الحريات تُعدّ من الحريات الأربع للبرمجيات الحرة؟",o:["استعمال البرنامج مجانًا فقط","دراسة الشيفرة المصدرية وتعديلها","بيع البرنامج دون ذكر المؤلف","منع الآخرين من نسخه"],a:1,e:"يجب أن تكون الشيفرة المصدرية متاحة ليتم دراستها وتعديلها."},
   {q:"أي رخصة تسمح بإعادة الاستعمال بحرية واسعة مع ذكر المؤلف فقط؟",o:["رخصة MIT","رخصة مملوكة","جميع الحقوق محفوظة","رخصة تجريبية"],a:0,e:"رخصة MIT متساهلة جدًا."},
   {q:"يُستعمل QGIS أساسًا من أجل:",o:["كتابة الوثائق","عرض البيانات الجغرافية وتحليلها","ضغط الفيديو","إدارة البريد الإلكتروني"],a:1,e:"QGIS نظام معلومات جغرافية حر."},
   {q:"\"المصدر المفتوح\" يعني أن:",o:["البرنامج مجاني دائمًا","الشيفرة المصدرية متاحة للاطلاع وفق رخصة","البرنامج بلا مؤلف","تعديله ممنوع"],a:1,e:"المجاني ليس مرادفًا للمصدر المفتوح: الرخصة هي المعيار."}
  ],
  hOrg:"التنظيم عن بعد والمراجع",
  org:["<b>المنصة</b>: فضاء واحد للمقياس (Moodle، أو Google Classroom عند الاقتضاء) يضم الجدول الزمني والمحتويات وتسليم الأعمال.","<b>المؤتمرات المرئية</b>: Google Meet أو Zoom أو BigBlueButton (حر)، وتُسجَّل الحصص وتُنشر خلال 24 ساعة.","<b>الاتصال الضعيف</b>: ملفات PDF خفيفة، ودفاتر قابلة للتحميل، واستعمال Google Colab لتفادي التثبيتات الثقيلة.","<b>التواصل</b>: منتدى للمقياس وساعة مداومة إلكترونية أسبوعيًا.","<b>مساعدة المبتدئين</b>: دليل تثبيت خطوة بخطوة في الأسبوع الثاني، وزميل «مرشد» لكل طالب يواجه صعوبة."],
  hRes:"مراجع مجانية",
  res:["التوثيق الرسمي للغة Python (python.org)","QGIS: التوثيق والدروس على qgis.org","ObsPy: دروس على docs.obspy.org","Git وGitHub: دليل «GitHub Skills»","بيانات مفتوحة: كتالوج زلازل USGS، وNatural Earth، وبوابة IRIS"],
  resNote:"يُرجى التحقق من الروابط الدقيقة قبل بداية المقياس.",
  sign:"قسم الجيوفيزياء – د. بوراوي سيف الله", license:"المقياس تحت رخصة حرة – يمكن تكييفه ومشاركته."
}
};
const GRADE_POINTS = [8,2,8,2];

/* ======================= Utilitaires ======================= */
const $ = s => document.querySelector(s);
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

let lang = store.get("lang", null) || ((navigator.language||"fr").slice(0,2));
if(!I18N[lang]) lang = "fr";
let done = store.get("done", []);
const grades = store.get("notes", {});
let currentTab = "presentation";
let qi = 0, score = 0;

const TAB_IDS = ["presentation","seances","outils","evaluation","quiz","organisation"];

/* ======================= Rendu ======================= */
function render(){
  const T = I18N[lang];
  document.documentElement.lang = T.lang;
  document.documentElement.dir = T.dir;
  document.title = T.docTitle;
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("active", b.dataset.l === lang));

  $("#dept").textContent = T.dept; $("#author").textContent = T.author;
  $("#title").textContent = T.title; $("#subtitle").textContent = T.subtitle;

  // onglets
  const tabsEl = $("#tabs"); tabsEl.innerHTML = "";
  TAB_IDS.forEach((id,i) => {
    const b = document.createElement("button");
    b.textContent = T.tabs[i]; b.dataset.id = id;
    b.onclick = () => show(id);
    tabsEl.appendChild(b);
  });

  // présentation
  $("#h-pres").textContent = T.hPres; $("#pres-intro").textContent = T.presIntro;
  $("#pres-table").innerHTML = T.presTable.map(r => `<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join("");
  $("#h-obj").textContent = T.hObj;
  $("#objectifs").innerHTML = T.obj.map(x => `<li>${esc(x)}</li>`).join("");
  $("#h-prog").textContent = T.hProg;

  // séances
  $("#h-plan").textContent = T.hPlan; $("#plan-hint").textContent = T.planHint;
  $("#h-trame").textContent = T.hTrame; $("#trame").textContent = T.trame;
  const weeksEl = $("#weeks"); weeksEl.innerHTML = "";
  T.weeks.forEach((s,i) => {
    const d = document.createElement("details");
    d.className = "week" + (done.includes(i) ? " done" : "");
    d.innerHTML = `
      <summary><span class="num">${i+1}</span><h3>${esc(s.t)}</h3></summary>
      <div class="body">
        <p>${esc(s.c)}</p>
        <p>${s.o.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</p>
        <p><b>${esc(T.toRender)}</b> ${esc(s.a)}</p>
        <label class="check"><input type="checkbox" ${done.includes(i) ? "checked" : ""}> ${esc(T.done)}</label>
      </div>`;
    d.querySelector("input").onchange = e => {
      done = e.target.checked ? [...new Set([...done, i])] : done.filter(x => x !== i);
      d.classList.toggle("done", e.target.checked);
      store.set("done", done); updateProgress();
    };
    weeksEl.appendChild(d);
  });
  updateProgress();

  // outils
  $("#h-tools").textContent = T.hTools; $("#search").placeholder = T.searchPh;
  $("#tools-note").textContent = T.toolsNote;
  renderTools($("#search").value);

  // évaluation
  $("#h-eval").textContent = T.hEval; $("#calc-hint").textContent = T.calcHint;
  $("#final-label").textContent = T.finalLabel;
  const calc = $("#calc"); calc.innerHTML = "";
  T.gradeItems.forEach((name,i) => {
    const row = document.createElement("div"); row.className = "calc-row";
    row.innerHTML = `<span>${esc(name)} <small class="note">(${GRADE_POINTS[i]} ${esc(T.points)})</small></span>
      <input type="number" min="0" max="20" step="0.25" value="${grades[i] ?? ""}" placeholder="/20">`;
    row.querySelector("input").oninput = e => { grades[i] = e.target.value; store.set("notes", grades); compute(); };
    calc.appendChild(row);
  });
  compute();
  $("#h-proj").textContent = T.hProj; $("#proj").textContent = T.proj;
  $("#h-rules").textContent = T.hRules; $("#rules").textContent = T.rules;

  // quiz
  $("#h-quiz").textContent = T.hQuiz; renderQuiz();

  // organisation
  $("#h-org").textContent = T.hOrg;
  $("#org-list").innerHTML = T.org.map(x => `<li>${x}</li>`).join("");
  $("#h-res").textContent = T.hRes;
  $("#res-list").innerHTML = T.res.map(x => `<li>${esc(x)}</li>`).join("");
  $("#res-note").textContent = T.resNote;

  // signature
  $("#sign").innerHTML = `<b>${esc(T.sign)}</b>`;
  $("#license").textContent = T.license;

  show(currentTab, false);
}

function show(id, scroll = true){
  currentTab = id;
  document.querySelectorAll("section").forEach(s => s.classList.toggle("active", s.id === id));
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  if(scroll) window.scrollTo({top:0});
  try{ history.replaceState(null,"","#"+id); }catch(e){}
}

function updateProgress(){
  const T = I18N[lang], n = done.length, tot = T.weeks.length;
  $("#progress-text").textContent = T.progress(n, tot);
  $("#progress-bar").style.width = (n/tot*100) + "%";
}

function renderTools(filter = ""){
  const T = I18N[lang], f = filter.toLowerCase(), box = $("#tools");
  box.innerHTML = "";
  T.tools.filter(o => o.join(" ").toLowerCase().includes(f)).forEach(o => {
    const el = document.createElement("div"); el.className = "tool";
    el.innerHTML = `<b>${esc(o[0])}</b><div>${esc(o[1])}</div><small>${esc(T.replaces)} ${esc(o[2])}</small>`;
    box.appendChild(el);
  });
  if(!box.children.length) box.innerHTML = `<p class="note">${esc(T.noTool)}</p>`;
}

function compute(){
  let total = 0;
  GRADE_POINTS.forEach((p,i) => {
    const v = Math.min(20, Math.max(0, parseFloat(grades[i]) || 0));
    total += v/20 * p;
  });
  $("#final").textContent = total.toFixed(2) + " / 20";
}

function renderQuiz(){
  const T = I18N[lang], box = $("#quizbox"), Q = T.quiz;
  if(qi >= Q.length){
    box.innerHTML = `<h3>${esc(T.finished)}</h3><p>${esc(T.yourScore)} <b>${score} / ${Q.length}</b></p><button class="btn" id="again">${esc(T.again)}</button>`;
    $("#again").onclick = () => { qi = 0; score = 0; renderQuiz(); };
    return;
  }
  const q = Q[qi];
  box.innerHTML = `<p class="note">${esc(T.qOf(qi+1, Q.length))}</p><h3>${esc(q.q)}</h3>`;
  q.o.forEach((txt, idx) => {
    const b = document.createElement("button"); b.className = "opt"; b.textContent = txt;
    b.onclick = () => {
      box.querySelectorAll(".opt").forEach((x,j) => { x.disabled = true; if(j === q.a) x.classList.add("ok"); });
      if(idx === q.a) score++; else b.classList.add("ko");
      const p = document.createElement("p"); p.textContent = q.e; box.appendChild(p);
      const n = document.createElement("button"); n.className = "btn"; n.textContent = T.next;
      n.onclick = () => { qi++; renderQuiz(); }; box.appendChild(n);
    };
    box.appendChild(b);
  });
}

/* ======================= Démarrage ======================= */
document.querySelectorAll("#langs button").forEach(b => {
  b.onclick = () => { lang = b.dataset.l; store.set("lang", lang); qi = 0; score = 0; render(); };
});
$("#search").oninput = e => renderTools(e.target.value);
const hash = (location.hash || "").slice(1);
if(TAB_IDS.includes(hash)) currentTab = hash;
render();
</script>
</body>
</html>
